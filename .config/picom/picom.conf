backend = "glx";

corner-radius = 10;

shadow = true;
shadow-radius = 30;
shadow-offset-x = -30;
shadow-offset-y = -30;
shadow-opacity = 0.7;

rules = (
    {
        # Got from: xprop WM_CLASS
        match = "class_g = 'Polybar'";
        shadow = false;
        corner-radius = 0;
    },
    {
        # Got from: xprop WM_CLASS
        match = "class_g = 'Rofi'";
        corner-radius = 0;
    },
    {
        match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'utility'";
        shadow = false;
    }
);
