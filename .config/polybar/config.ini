[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[settings]
screenchange-reload = true
pseudo-transparency = true

[bar/myBar]
width = 100%
height = 24pt
background = ${colors.background}
foreground = ${colors.foreground}
padding-left = 1
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.disabled}
font-0 = monospace:size=14;2
modules-left = xwindow
modules-center = date windows
modules-right = brightness2 brightness1 pulseaudio wlan
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/windows]
type = custom/script
exec = $HOME/projects/dotfiles/.config/polybar/windows.sh
tail = true

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/brightness1]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
poll-interval = 0
enable-scroll = true
scroll-interval = 10
label = %{F#F0C674}B1%{F-} %percentage%%

[module/brightness2]
type = custom/ipc
label = %{F#F0C674}B2%{F-} %output%%
hook-0 = ddcutil getvcp 10 | grep -oP 'current value\s*=\s*\K[0-9]+'
initial = 1
scroll-up = ddcutil setvcp 10 + 5 && polybar-msg action brightness2 hook 0
scroll-down = ddcutil setvcp 10 - 5 && polybar-msg action brightness2 hook 0

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "A "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = %{F#F0C674}A%{F-} (muted)
label-muted-foreground = ${colors.disabled}
click-right = $HOME/projects/dotfiles/switch-audio-output.sh

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = %{F#F0C674}W%{F-} %essid%
label-disconnected = %{F#F0C674}W%{F#707880} disconnected

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.primary}
